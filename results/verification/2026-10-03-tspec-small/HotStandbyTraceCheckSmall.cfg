\* Exhaustive safety check of TSpec at small bounds (one order, one no-op, MaxLog 3).
\* The CI-bound config (HotStandbyTraceCheck.cfg) does not exhaust in hours.
SPECIFICATION TSpec
CONSTANTS
    Nodes = {a, b}
    Orders = {o1}
    Nops = {p1}
    TraceLog <- EmptyTrace
    MaxEpoch = 3
    MaxLog = 3
    MaxHostCrashes = 1
    MaxProcCrashes = 1
    MutNoOutputRule = FALSE
    MutNoMemberCheck = FALSE
    MutNoIncarnation = FALSE
    MutNoTruncate = FALSE
    MutNoDedupe = FALSE
    MutAckBeforeAppend = FALSE
    MutAckWhileCandidate = FALSE
    MutSoloReleaseFromL2 = FALSE
SYMMETRY NodeSymmetry
INVARIANTS
    TypeOK
    OnePrimaryPerEpoch
    WitnessAuthority
    LeaderCompleteness
    ReleasedConsistent
    ClientStreamPrefix
    NoDuplicateExecution
    ClientNoDuplicate
