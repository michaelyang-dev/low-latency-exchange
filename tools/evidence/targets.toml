# Evidence ledger definitions (docs/plan/README.md evidence matrix, docs/plan/12 §8).
# Numeric targets name the campaign target, the summary metric, the comparison
# and threshold; the statement is generated from the measured value.
# Non-numeric targets name the artifact(s) whose existence/green status is the evidence.

[T11a]
statement = "Textbook baseline B0 (tag lob-b0): sampled median {value:.1f} ns per message on 01302019"
campaign_target = "t11a"
metric = "net_p50_ns"
coarse_metric = "net_mean_ns"
coarse_threshold_ns = 2.0
kind = "published"

[T11b]
statement = "Optimized LOB: sampled median {value:.1f} ns per message on 01302019"
campaign_target = "t11"
metric = "net_p50_ns"
coarse_metric = "net_mean_ns"
coarse_threshold_ns = 2.0
op = "<="
threshold = 42.0

[T12]
statement = "{value_m:.2f}M msgs/s single core replaying 01302019"
campaign_target = "t12"
metric = "msgs_per_s"
op = ">="
threshold = 18.0e6

[T18]
statement = "Tick-to-trade (TTT_raw, AF_XDP): p50 {p50:.2f} us / p99 {p99:.2f} us"
campaign_target = "t18"
metrics = ["ttt_raw_p50_us", "ttt_raw_p99_us"]
op = "<="
thresholds = [14.0, 38.0]

[T19]
statement = "p99 tick-to-trade {value:.2f}x lower than epoll"
campaign_target = "t18"
metric = "p99_ratio_epoll_over_afxdp"
op = ">="
threshold = 3.1

[T20]
statement = "{value_m:.2f}M msgs/s end to end on 8 cores (single node, solo mode)"
campaign_target = "t20"
metric = "max_valid_msgs_per_s"
op = ">="
threshold = 4.2e6

[T25]
statement = "Takeover max {value:.1f} ms across fault classes F1-F5, F9, F10"
campaign_target = "t25"
metric = "takeover_max_ms"
op = "<"
threshold = 50.0

[T31]
statement = "nlog hot-path call: net median {value:.2f} ns (M1a)"
campaign_target = "t31"
metric = "m1a_net_p50_ns"
coarse_metric = "m1a_net_mean_ns"
coarse_threshold_ns = 1.0
op = "<="
threshold = 9.0

[T13]
artifacts = ["docs/perf/experiments"]
statement = "Logged optimization experiments (EXP-*.md)"
count_glob = "docs/perf/experiments/EXP-*.md"
op = ">="
threshold = 14

[T14]
kind = "fuzz_ops"
ledger = "fuzz/ledger/runs.jsonl"
threshold = 2.0e9
sanitizer_threshold = 2.0e8
statement = "Differential fuzzing (random ops)"

[[T14.groups]]
label = "ITCH books"
harnesses = ["lobdiff", "lobfuzz"]
tree_dirs = ["src/lob", "src/book", "src/common"]
books = ["b0", "vec_list_std", "vec_intr_std", "vec_intr_flat", "opt", "opt_huge", "win", "map_intr_flat", "win_list_flat"]

[[T14.groups]]
label = "matching engine"
harnesses = ["enginediff"]
tree_dirs = ["src/engine", "src/lob", "src/common", "src/proto/ouch50", "src/proto/itch50"]
books = ["engine"]

[T23b]
kind = "bug_count"
ledger = "sim/ledger/bugs.yaml"
threshold = 23
statement = "Counted simulator bugs"

[T27]
artifacts = ["verify/tla/HotStandby.tla", "verify/tla/HotStandbyLive.tla", "docs/verification/tla-results.md"]
status_from = "docs/verification/tla-results.md"
statement = "TLA+ safety and liveness models pass; every safety and liveness mutant fails"

[T29]
artifacts = ["verify/genmc", "docs/verification/queues-genmc.md"]
status_from = "docs/verification/queues-genmc.md"
statement = "GenMC: queue harnesses pass under RC11 and IMM"

