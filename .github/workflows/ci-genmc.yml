name: ci-genmc
on:
  push:
    branches: [main]
    paths: ['src/concurrent/**', 'verify/genmc/**', 'tools/genmc/**', '.github/workflows/ci-genmc.yml']
  pull_request:
    paths: ['src/concurrent/**', 'verify/genmc/**', 'tools/genmc/**', '.github/workflows/ci-genmc.yml']
  schedule:
    - cron: '41 2 * * *'

jobs:
  genmc:
    runs-on: ubuntu-26.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM 22 and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang-22 llvm-22 llvm-22-dev libclang-22-dev libffi-dev zlib1g-dev libedit-dev g++-15
      - name: LLVM version (keys the GenMC cache; a point update needs a rebuild)
        id: llvm
        run: echo "version=$(llvm-config-22 --version)" >> "$GITHUB_OUTPUT"
      - name: Cache GenMC build
        id: cache
        uses: actions/cache@v4
        with:
          path: genmc-install
          # r2: installs carry the C++ runtime wrappers (see the build step)
          key: genmc-v0.19.0-r2-llvm${{ steps.llvm.outputs.version }}
      - name: Build GenMC v0.19.0
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v0.19.0 https://github.com/MPI-SWS/genmc.git genmc-src
          cmake -S genmc-src -B genmc-build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_PREFIX_PATH=/usr/lib/llvm-22 -DCMAKE_CXX_COMPILER=g++-15 \
            -DCMAKE_INSTALL_PREFIX=$PWD/genmc-install
          cmake --build genmc-build -j
          cmake --install genmc-build
          # v0.19.0 installs only the runtime's *.h files, not its C++ wrappers (atomic,
          # thread, cstdlib, cstdio); the binary finds those in its source tree, which a
          # cache hit does not have, and <atomic> would resolve to libstdc++'s.
          cp -R genmc-src/lli/runtime-include/c/. genmc-install/include/genmc/runtime/
      - name: The GenMC install is self-contained (its C++ runtime wrappers are there)
        run: test -f genmc-install/include/genmc/runtime/atomic && test -f genmc-install/include/genmc/runtime/thread
      - name: Queue headers include only the allowed headers (GenMC-checkable)
        run: tools/genmc/check_includes.sh
      - name: Run every harness under RC11 and IMM
        # --quick skips the long pre-registered SCQ bounds, which run on a lab or VM
        # host without a CI time limit (verify/genmc/RESULTS.md).
        run: |
          set -o pipefail
          genmc-install/bin/genmc --version 2>&1 | tee genmc-run.log
          PATH=$PWD/genmc-install/bin:$PATH GENMC_TIMEOUT=3600 tools/genmc/run_all.sh --quick 2>&1 | tee -a genmc-run.log
      - name: Report the failure as an annotation
        if: failure()
        run: tools/ci/annotate_tail.sh "GenMC" genmc-run.log 60
