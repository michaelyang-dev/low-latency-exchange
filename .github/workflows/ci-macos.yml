name: ci-macos
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        preset: [dev, asan-ubsan, tsan]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: brew install ninja cmake || true
      - run: cmake --preset ${{ matrix.preset }}
      - name: Build (compiler errors are also reported as annotations)
        run: |
          set -o pipefail
          cmake --build build/${{ matrix.preset }} -j 2>&1 | tee build.log || {
            grep -E "error:|FAILED:" build.log | head -40 | while IFS= read -r l; do echo "::error::${l}"; done
            exit 1; }
      - run: tools/ci/ctest.sh --test-dir build/${{ matrix.preset }} --output-on-failure -j 3
