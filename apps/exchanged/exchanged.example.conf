# exchanged example configuration (docs/design/exchange-node.md §10).
# The [symbols] .. [params] tables become the engine's journaled Config records at
# day start (ADR-028). Credentials are salted hashes: exchanged --hash-password PASS.
# Sample credentials only: the passwords are "alpha-pw", "bravo-pw", "glimpse-pw".

[node]
name = exA
id = 0                         # 0 = node A, 1 = node B (SoupBinTCP session instance)
data_dir = ./data/exA          # journal/<date>/, outlog/<date>/, logs/
mode = solo                    # solo | paired
runner = threads               # threads (core map) | inline (one thread, dev)
backend = epoll                # epoll | busypoll | busypoll-irq-suspend | uring | uring-napi | xsk
                               # (one configuration per variant: lab/exchanged/variants)
metrics = true                 # /lle-stats-exA (lle_top exA)
nlog = true                    # logs/exA-<date>.nlog (nlog_decode)

[cores]                        # 01 §7, bench host A
gw0 = 8
gw1 = 9
seq = 10                       # in paired mode the replica runs here too
engine = 11
md = 12
io = 14
glimpse = 2                    # housekeeping CPU, outside the 8-core set

[day]
date = 20261001
mold_session = LLE0000001
soup_session = LLE0000001
schedule = standard            # standard | early-close | none
noii_clock = true              # the 1 Hz clock (halts, LULD, MWCB, GTT, peg pulls)
utc_offset = -4                # local midnight of the trading date (EDT)
clock = real                   # real | offset | manual
start = 03:00:00               # offset/manual clock: exchange time at start
auto_end = false               # DayEnd after the last scheduled timer

[journal]
segment_mib = 1024
spares = 2
l2_mib = 1024

[gateway]
gw0 = 0.0.0.0:15000
gw1 = 0.0.0.0:15001
heartbeat_ms = 1000
idle_timeout_ms = 15000
max_conns = 64

[md]
line_a = 239.1.1.1:26477
line_b = 239.1.1.2:26478
rerequest = 0.0.0.0:26479
max_packet_a = 1472
max_packet_b = 1000
multicast_if = eth1
ttl = 1

[glimpse]
listen = 0.0.0.0:15100
user = GLIMPS
password = sha256$0a0b0c0d$a2cc9dbe0ae03f6725bc7edda6d0727e17b6b914aac304bb6df8d1104a67dee2

[admin]
port = 15500
operator.1 = 000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f

# Paired mode (node.mode = paired):
# [ha]
# bind = 10.10.0.1:16000       # dedicated A-B link
# peer = 10.10.0.2:16000
# witness = 10.0.0.3:17000     # witnessd on host C (data network)
# witness_bind = 10.0.0.1      # the witness link's local address (default: the kernel's choice by
#                              # route; ha.bind's 10.10.0.1 would get no answer from 10.0.0.3)
# primary = 0
# heartbeat_ms = 1
# t_d_ms = 20
# t_ack_ms = 10
# rto_ms = 2                   # APPEND retransmission: above the A-B round trip (go-back-N)
# rejoin_retry_ms = 5          # EPOCH_END_QUERY / CATCHUP_REQ retransmission

[symbols]
AAPL prior=150.00 lot=100 tick=0.01 tier=1 adv=50000000
MSFT prior=300.00 lot=100 tick=0.01 tier=1 adv=20000000
QQQ  prior=400.00 tier=1 adv=40000000 etp

[accounts]
