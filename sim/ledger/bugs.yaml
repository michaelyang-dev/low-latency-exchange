    oracle: O-STREAM
    signature: "O-STREAM:450484:0x616ca6ea94f0ad73"
    root_cause: >-
      When a node becomes primary (a takeover, a JOIN's new epoch, a RESUME) the replication
      stage resyncs the sequencer to the record log's tail, and Sequencer::resume() started
      it. After the close the day was over (06 §10: nothing is journaled after DayEnd), but
      the new primary then journaled the dead instances' InstanceDowns (ADR-032's first
      list), gateway input and a second DayEnd after the first. Clients that already had
      End of Session received more messages, and subscribers' End of Session came short of
      the stream. Fix: the resync checks the log (the last record but EpochStarts is DayEnd)
      and keeps the sequencer stopped (Sequencer::day_already_ended), dropping the pending
      InstanceDowns and re-injected input; split mode carries the flag in the resync slot.
    fix_sha: a87e7c9b9320181ad5000db10a49c4f4f0c22e90
    regression_test: tests/sim_regressions/DST-008_takeover_after_day_end
    counted: true
    count_reason: >-
      Production replication stage and sequencer of exchanged (apps/exchanged/repl_stage.h,
      src/sequencer). Correctness defect under one failure after the close: the journal, the
      output streams and the engine change after the day ended, and clients get messages
      after End of Session. Found by exsim's exchange_ha world through O-STREAM (a client's End
      of Session with fewer messages than the final journal holds) and O-ARB, diagnosed from
      the final journal's repeated DayEnd records. Reproduces from seed at the found tree: 12
      of 2,000 exchange_ha seeds (11 O-STREAM, one O-ARB; campaign dst-008-found-exchange_ha-2000), all passing at the
      fix. One root cause, one fix (by the node's owner, from the simulator's proposed patch).
      The seed-independent regression test runs two paired nodes and the witness on the
