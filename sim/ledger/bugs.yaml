    oracle: O-SNAPSHOT
    signature: "O-SNAPSHOT:8695122:0x54add19254e5dcb5"
    root_cause: >-
      A snapshot at P describes the history up to P, and a rejoining node truncates its
      journal and writes its partner's records at the same indices. snapshotd
      (apps/snapshotd/snapshotter.h), a process of its own, resumed from a snapshot by
      seeking its follow cursor to P + 1 without the content crc of record P, so the
      cursor could not tell that record P had been replaced. In the seed (snapshotd as a
      process of its own, the only O-SNAPSHOT failure in 10,000 exchange_ha seeds at the
      found tree) xa's snapshotd wrote a snapshot at 259 from xa's own records, failed
      on a disk error and resumed from it; exchanged then rejoined, truncated the journal
      to 108 (removing that snapshot file) and caught up from xb. snapshotd applied xb's
      records on top of xa's state from 260 on, and every snapshot from 517 held a state
      no replay of the final journal reaches (O-SNAPSHOT at 23995). Recovery or a
      restarted snapshotd starting from such a snapshot would have taken that state.
      Fix: the sidecar names record P by its content crc (LLEOUTD2). snapshotd removes a
      snapshot whose record P the journal no longer holds, and when it resumes from a
      snapshot the cursor checks record P, so a later truncation shows as a divergence.
    fix_sha: 289f26ea42b6b493535f930022330d60f9ff5521
    regression_test: tests/sim_regressions/DST-017_snapshotd_resume_record
    counted: false
    count_reason: >-
      Not counted: the mechanism (resuming from a snapshot without record P's crc,
      against a journal a rejoin rewrites) was predicted by reading snapshotter.h and
      the follow cursor while snapshotd as a process of its own and the O-SNAPSHOT
      oracle were added, before any campaign ran with them. exsim then reproduced it.
      As with DST-014, rule 2 asks for a bug found by exsim, and here exsim confirmed a
      bug that code reading had already found. The fix, the regression test, the
      process model and the oracle are kept.
  - id: DST-018
    title: "snapshotd's follow cursor, in a segment it had not read a record of, took a rejoin's records for its history after the segment was recycled"
    component: journal
    targets: [T05, T24]
    category: production
    found_utc: "2026-10-07T15:17:00Z"
    campaign_id: 20261007T143605Z-0f8912e7-3c09b3d67f377146
    sha_found: 0f8912e7eb76ac6faf1734e2795e141508672e9a
    seed: "0x3c09b3d67f377726"
    exsim_args: ["--mode=swarm", "--world=exchange_ha"]
    swarm_digest: "0x9aa3ef9be1c88f88"
    platform: macos-arm64
    build: sim-RelWithDebInfo
    oracle: O-SNAPSHOT
    signature: "O-SNAPSHOT:607507:0x699bf5002e628f34"
    root_cause: >-
      FollowCursor (src/journal/follow_cursor.h), which snapshotd follows the journal
      with, positions again after a suspected divergence expecting the content crc of
      the record it delivered last, but kept that expectation only when it had walked a
      record of the segment it was in. In the seed (snapshotd as a process of its own)
      xb's snapshotd had applied records up to 1262 and moved into the writer's next
      segment, whose header the writer writes at the switch, before its first record.
      exchanged on xb then died and rejoined: the truncation to 1208 recycled that
      segment, and the catch-up wrote xa's records from 1209, from a new segment starting
      at 1225. The cursor suspected a divergence (the segment it was reading was
      recycled), positioned again at 1263 without an expectation, walked the new
      segment's 1225..1262, took them for its history and delivered the new 1263, whose
      prev crc names a record snapshotd never applied. snapshotd applied the new records
      on top of the old 1209..1262, and its snapshot at 1289 held a state no replay of
      the final journal reaches (O-SNAPSHOT). Recovery or a restarted snapshotd starting
      from it would have taken that state. Fix: once the position is verified, the chain
      state is the record delivered last in any segment, and a suspicion (or an I/O
      failure) positions again expecting it, so the rewrite is a divergence and snapshotd
      starts over from a snapshot the journal still holds.
    fix_sha: 199053472e265ce3f5a9088eb9b89023d2882656
    regression_test: tests/sim_regressions/DST-018_follow_cursor_segment_switch
    counted: true
    count_reason: >-
      production journal code (the follow cursor snapshotd runs on), found by exsim in a
      2,000-seed exchange_ha campaign (1 failure) on a seed that uses none of the
      dimensions added at the found tree, so the defect predates them; reproduces from
      seed at the found tree and at the fix's parent (the same trace hash), passes with
      the fix; the mechanism was not predicted: DST-017's fix read the cursor and relied
      on a later truncation showing as a divergence, and the segment-switch case was
      identified from the seed's trace. Fixed with a seed-independent regression test
      that fails without the fix (41 records of the new history delivered).
  - id: DST-019
    title: "a node starting the day afresh numbered its output from the output log an earlier start had left, after serving without its incarnation file"
    component: exchanged
    targets: [T05, T24]
    category: production
    found_utc: "2026-10-07T06:39:00Z"
    campaign_id: 20261007T045754Z-53ecbbcf-263470690ec264ac
    sha_found: 4f1df7dcd23bc531880b12cd090bd6955ec8a937
    seed: "0x263470690ec294ea"
    exsim_args: ["--mode=swarm", "--world=exchange_ha"]
    swarm_digest: "0x6e56f9e4e9328c0c"
    platform: linux-aarch64
    build: sim-RelWithDebInfo
    oracle: O-LINE
    signature: "O-LINE:417370:0x14871ab2af0dd206"
    root_cause: >-
      A node whose journal recovered empty started the day afresh (apps/exchanged/node.cpp)
      but took its MoldUDP64 and SoupBinTCP positions from the day's output log, which an
      earlier start of the day could have left, and a paired node ignored a failure to
      write its incarnation file, the file that makes a restart rejoin instead of starting
      the day again (DST-006). In the seed (a rollover seed) xb started the new day, could
      not write its incarnation file (a disk error), served anyway (its md sent the day
      start's messages 1..6 on line B) and stopped. Its restart found the day start
      without an EpochStart and refused; the runbook (exchange-node.md §8) moved the
      journal's segments aside, and with no incarnation file to keep xb started the day
      afresh. Its output log still held messages 1..6: their count set the positions, the
      new day start's messages went out as 7..12, and line B carried other bytes than line
      A for sequence 7 (O-LINE). Fix: a fresh day start resets the day's output log, and a
      paired node writes its incarnation file before it sequences or serves anything and
      does not start if it cannot; the simulator's node does the same. The fix tag
      (dst/DST-019/fix) is the fix applied to the found tree: later trees draw this seed
      differently (a lazy-reader day), so the seed is checked against the fix in the world
      it failed in. Seen again (the same mechanism, passing with the fix) in a 6,000-seed
      campaign at 839df0c: 0x44aa32c6f8653bb6 (O-LINE) and 0x44aa32c6f8652a86 (O-STREAM:
      the SoupBinTCP side, a session's messages numbered after the earlier start's).
    fix_sha: 16f56ece621998fa7e1f315eeb3d8c722492654e
    regression_test: tests/sim_regressions/DST-019_fresh_day_stale_outlog
    counted: true
    count_reason: >-
      production code (exchanged's day start), found by exsim in a 15,000-seed
      exchange_ha campaign (1 failure) on the VM; reproduces from seed at the found tree
      and passes with the fix applied to it; the mechanism was not predicted: the seed's
      line packets (the day start's messages resent under sequence 7) and an instrumented
      run (the incarnation write failed) identified it. Fixed with a regression test that
      runs exchanged and fails without the fix (the output log holds the earlier start's
      messages and the new ones after them; a paired node becomes ready without its
      incarnation file).
