    seed: "0x000000000000025d"
    exsim_args: ["--mode=swarm", "--world=exchange"]
    swarm_digest: "0x2844833718778543"
    platform: macos-arm64
    build: sim-RelWithDebInfo
    oracle: O-RECOVER
    signature: "O-RECOVER:1162:0x54c37fc53e30e670"
    root_cause: >-
      When the process died, or a journal write failed, while the day-start records were
      being written, the journal held DayStart and some Config chunks but no EpochStart.
      Every later start is refused by design (nothing was released; the remedy is to move
      the journal aside and start the day again, recovery.h, exchange-node.md §8). But
      basic_replay_day (previously recovery.cpp) compared the journaled configuration with
      the configuration file (ADR-028) before checking that the day start was complete; a
      partial Config is a prefix of the tables, so the refusal read "the journaled
      configuration differs from the configuration file (ADR-028): restore the file the day
      was started with". Fix: the incomplete-day-start verdict is checked first; a complete
      day start with a genuinely different configuration still gets the ADR-028 verdict.
    fix_sha: uncommitted
    regression_test: tests/sim_regressions/DST-005_incomplete_day_start_verdict
    counted: true
    count_reason: >-
      Production recovery of exchanged (apps/exchanged/recovery_impl.h, the code a solo
      node runs at every restart). Availability defect: the refusal names the wrong remedy,
      so an operator following the runbook keyed on the message restores an identical
      configuration file and the node keeps refusing; the day never comes back without
      diagnosis the message misdirects. Found by exsim's exchange world (O-RECOVER: the node
      refused to start after healing), then pinned by the oracle's check of the verdict
      against the journal's actual state (records but no EpochStart must be reported as an
      incomplete day start; the world's operator then runs the runbook). Reproduces from
      seed at the found tree: 13 of 2,000 exchange seeds (campaign
      dst-005-found-exchange-2000), all passing at the fix. One root cause, one fix. The
      seed-independent regression test runs the production sequencer, journal writer,
      journal::recover and exch::basic_replay_day: DayStart plus one Config chunk gets the
      ADR-028 verdict at the found tree and the incomplete-day-start verdict at the fix,
      and a complete day start with another configuration keeps the ADR-028 verdict.
  - id: DST-006
    title: "a paired node whose journal recovered empty after it had started the day ran the day start again (incarnation 1, the day's first primary) while its partner ran the day"
    component: exchanged
    targets: [T10, T24, T26]
    category: production
