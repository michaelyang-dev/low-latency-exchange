    signature: "O-LIVE:17462761:0x77fd32fd4725b7f4"
    root_cause: >-
      A primary releases up to its backup's acknowledgement (paired) or its durable
      index (solo), and a new primary releases nothing before its own EpochStart is
      durable (10 §4; the SoloReleaseFromL2 mutant). While release is held the engine
      fills the egress ring with outputs it may not send and stops applying, so its L2
      cursor stops; the sequencer goes on until L2 is full. The 1 Hz clock's timer
      records fill it quickly. When the witness then granted the primary an epoch
      (SOLO), the replica had to append the epoch's EpochStart after every sequenced
      record, and L2 had no room for it (src/journal/l2_ring.h, appended through
      apps/exchanged/repl_stage.h append): release waited for the EpochStart, the engine
      for release, L2 for the engine. The node never sequenced or released again, and
      its partner's rejoin was refused at every attempt (no epoch end while the
      EpochStart is pending), so the day never ended (O-LIVE). In the seed (the only
      failure in 10,000 exchange_ha and exchange_ha_split seeds at the found tree; its
      day ran the clock) the backup's acknowledgements stopped at 10,821 while the
      primary sequenced on to 51,041: its engine stopped at 37,106 with the egress ring
      full, and its 1 MiB L2 held 32 free bytes when W granted it SOLO in epoch 2. The
      deposed partner restarted and was refused 3,614 times. Fix: the sequencer's
      reservations (seq_stage.h) and replicated records leave room for one EpochStart in
      L2 (L2Ring::try_reserve_keeping_reserve, kEpochStartReserve); only an EpochStart
      may take it.
    fix_sha: 60328d896e041caba2f33e5506c5bbf1e595bf13
