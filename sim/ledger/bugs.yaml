      same cause (0x...f8cc truncating to 116, 0x...ff08 truncating to 1100), both passing
      at the fix; diagnosed from the node's "journal truncation to t failed: zeroing
      failed" followed by the refusal. Reproduces from seed at the found tree with the
      recorded signature on linux-aarch64 and macos-arm64. One root cause, one fix. The
      seed-independent regression test truncates a journal whose tail after t is several
      in-flight windows long, failing each write of the truncation in turn
