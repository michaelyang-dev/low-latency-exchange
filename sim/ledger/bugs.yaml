    root_cause: >-
      The output log holds released messages only: the io stage appends what egress
      releases (ADR-005), and the gateways' SoupBinTCP replay stores and the re-request
      server are built from it. A joiner copies records from its solo primary beyond the
      primary's release: solo release follows the primary's durable index (10 §4), and in
      the seed a disk stall held it at 650 while the joiner copied up to 758. The joiner
      restarted and rejoined without a truncation, and the reload (start_impl.h reload_to,
      basic_replay_day) replayed its journal through 758 and appended every regenerated
      output past the end of the output log as found. Its gateways then replayed those
      outputs, executions among them, to clients that logged in as mirror sessions. The
      primary crashed and resumed (RESUME) at 657, the joiner truncated to it, and clients
      held messages and fills the final journal does not have; they asked for SoupBinTCP
      sequence numbers neither node would reach, were refused ("requested sequence is
      ahead"), and never got End of Session (O-LIVE). Fix: the reload keeps the outputs
      past the end of the output log (RecoveredDay::deferred) instead of writing them, and
      the engine stage hands them, then a recovered DayEnd marker, to egress before any new
      record (stage_deferred); the release-gated egress stages pass them on only once
      released, so the output log, the stores and the lines keep the Output Rule. Until
      they are all in the ring, egress keeps every consumer's done watermark below them
      (EgressState::hold); the engine's applied position is unchanged, since the
      replication stage compares it with a truncation point. A RESUME's reload is
      the solo primary of record's: its journal is the day's history, solo release
      follows its durable index, and the outputs are written at once
      (Replica::reload_is_resume; tests/integration/exchange F7-resume).
