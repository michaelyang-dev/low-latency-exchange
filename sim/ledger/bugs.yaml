    oracle: O-LIVE
    signature: "O-LIVE:13580325:0x77fd32fd4725b7f4"
    root_cause: >-
      An APPEND carries whole records up to the 1,400-byte datagram limit, or one
      fragment of a larger record. Replica::receive_records (src/repl/replica.h) took
      a record's fragments only in order: a fragment that arrived ahead of its
      predecessor counted as a gap (a NACK), and one at offset 0 started the record
      over. The data plane loses, duplicates and reorders datagrams (the network of
      plan 10 §6), and the sender's go-back-N retransmission resends a record's
      fragments back to back, so every retry of a record cut into k fragments needed
      all k to arrive in order. With production's 1 Hz clock ([day] noii_clock, on by
      default) the day's schedule is about 57,600 entries, journaled at day start as
      some 29 config records near the 32 KiB limit, about 24 fragments each. In the
      seed (the fastest of 28 O-LIVE failures in 1,500 exchange_ha seeds at the found
      tree; its day ran the clock) xa stopped on an I/O error before its day start had
      an EpochStart, was refused at restart, the runbook moved its journal aside, and it
      caught up from an empty journal while xb resumed as solo primary. Under the
      network's delay jitter (2.1 million of 2.4 million datagrams reordered, none
      lost) no burst of 24 fragments arrived in order: xa took records 1-4, then
      counted 2.2 million gaps and sent 12,789 NACKs, xb retransmitted 12,788 times,
      and the catch-up never reached the JOIN for the rest of the day (O-LIVE). It was
      first seen on seed 0xd of a development run, before the later world changes
      moved every seed's trajectory. Fix: fragments are copied to
      their offsets in any order, the received byte ranges are tracked in a fixed
      array, and the record is checked and appended once all of its bytes are there.
      A reassembly is keyed by index, length, epoch and stream, so fragments of
      another record start over.
    fix_sha: f7b1f804fc67734aa07187a35f171b268f8586e6
    regression_test: tests/sim_regressions/DST-015_fragments_out_of_order
    counted: true
    count_reason: >-
      Production code (src/repl/replica.h). Found by exsim (O-LIVE) in exchange_ha
      once its days ran production's default 1 Hz clock, which is a coverage change,
      not a planted fault. The coverage survey that suggested the clock gave a general
      reason (bursts of overdue timers) and did not anticipate this mechanism.
      Reproduces from seed at the found tree with the recorded signature on
      macos-arm64. One root cause, one fix. The seed-independent regression test
      replicates a 30,000-byte record (about 23 fragments) to a backup that receives
      every datagram newest first: at the found tree the backup stops at the record
      (3 of 7 records); at the fix it holds all 7.
