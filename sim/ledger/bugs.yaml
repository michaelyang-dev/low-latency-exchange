    signature: "O-RECOVER:213046:0xf187ba10f1ea9656"
    root_cause: >-
      Rejoin truncation (src/repl/journal_truncate.h, 10 §5 step 2) zeroes everything after
      the truncation point t in the segment holding it. It zeroed forwards from t, with
      durable 1 MiB writes (journal::detail::zero_range). A write that failed with EIO
      after the first ones, or a process killed between them, left zeros right after t and
      the old records further on, which still carry the segment's seal. Recovery (06 §7)
      reads validly sealed records beyond the in-flight window after the end of the valid
      prefix as corruption and refuses, so the node could not start again: in the seed the
      rejoining node's truncation to 116 failed ("zeroing failed"), it exited, and every
      later start was refused ("valid record beyond in-flight window: sealed record at
      offset 282624, last valid index 116 ends at 18960") until the end of the run
      (O-RECOVER). The file's own comment claimed a crash at any point was harmless. Fix
      (truncate_detail::zero_tail_backwards): zero from the end of data backwards towards
      t, in durable chunks of half the in-flight window, the partial first block last.
      Stopped at any point, the segment holds the records after t up to some offset and
      zeros after it, with at most one torn chunk in between, which recovery treats as a
      torn tail; the journal is valid and ends after t, and the rejoin truncates again.
    fix_sha: bb601fc0bea70cff67494ece28f1b11685df9034
    regression_test: tests/sim_regressions/DST-012_truncation_zeroing_order
    counted: true
