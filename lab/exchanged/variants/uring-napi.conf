# exchanged, variant uring-napi (iii-n) of METHODOLOGY §14 (07 §1): one of six configurations
# that differ only in the block at the end (the backend and its device settings). Every
# variant runs the same binary, protocols, workload, pinning ([cores]) and NIC queues.
# tests/integration/exchange/exchange_config_test.cpp checks that the files are identical
# outside that block. Host A of the lab: ens1f0np0 is the data port (lab/tune.sh), and
# lab/exchanged/xsk_steer.sh steers the AF_XDP queues of the xsk variant.
# Sample credentials only (passwords "alpha-pw", "bravo-pw", "glimpse-pw").

[node]
name = exA
id = 0
data_dir = /var/lib/lle/exA
mode = solo
runner = threads
metrics = true
nlog = true

[cores]                        # 01 §7, bench host A: the same for every variant
gw0 = 8
gw1 = 9
seq = 10
engine = 11
md = 12
io = 14
glimpse = 2                    # housekeeping, outside the 8-core set

[day]
date = 20261001
mold_session = LLE0000001
soup_session = LLE0000001
schedule = standard
noii_clock = true
utc_offset = -4
clock = real
auto_end = false

[journal]
