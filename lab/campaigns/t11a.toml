# T11a: the textbook baseline B0, measured exactly like T11b (docs/perf/METHODOLOGY.md §4.3).
# Run from a git worktree at tag lob-b0 (or lob-b0-hN), so preset b0 builds the frozen tree.
target = "t11a"
methodology = "methodology-v1"
profile = "host-a"
ifaces = []
preset = "b0"
repetitions = 15
input = "data/itch/01302019.NASDAQ_ITCH50.bin"
input_sha256 = "1d0972ffc25b35902ccc3f9069aae517da56903d5795f872902b8697315f30c3"
variant = "b0"
commands = [
  "GLIBC_TUNABLES=glibc.malloc.trim_threshold=137438953472 lab/perf_wrap.sh {out}/run-{rep}-sampled.perf.csv {build}/apps/lob_replay/lob_replay --file {input} --expect-sha256 {input_sha256} --variant {variant} --mode sampled --cpu 11 --huge 1g --warmup 1 --strict-faults --seed 20260930 --env-json {out}/env.json --out {out} --run-name run-{rep} && tools/results/merge_perf.py {out}/run-{rep}.json {out}/run-{rep}-sampled.perf.csv",
]
