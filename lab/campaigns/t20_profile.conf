# loadgen v2 profile for T20 and T32: the order mix and the pre-trade risk profile
# (METHODOLOGY §15, §18; plan 07 §3 "loadgen" mix; plan 05 §7 risk; ADR-014).
# One file feeds both sides: loadgen builds its schedule from it and refuses a schedule
# the [risk] limits would reject; `loadgen profile --profile lab/campaigns/t20_profile.conf
# --exchanged-risk 1:16` prints the exchange's [risk] rows from the same values.
#
# DRAFT. METHODOLOGY §18 fixes the profile from labelled pilots before the v2 tag; until
# then `status` stays TBD_BY_PILOT and lab/run_campaign.sh refuses t20/t32 headline runs.
status = TBD_BY_PILOT

[mix]                 # percent of inbound messages (plan 07 §3)
enter = 45            # non-marketable limit orders around a fixed mid per symbol
cancel = 40
replace = 10
ioc = 5               # marketable IOC: takes the best opposite level, fills completely

[book]
symbols = 2000        # about 2,000 symbols (METHODOLOGY §15)
depth_ticks = 10      # resting prices 1..10 ticks from the mid (nearer ticks more likely)
tick = 0.01
prefill_per_symbol = 8
lot = 100
lots = 1-10           # Enter/Replace sizes: 100..1,000 shares
# IOC sizes: 100..1,000 shares, the Enter size range, so an IOC removes about one
# resting order and the book stays level (45% Enter against 40% Cancel + 5% IOC); smaller
# IOCs let the book grow by thousands of orders per second per session.
ioc_unit = 100
ioc = 1-10
dup_guard = 16        # an Enter's content never repeats among the session's last 16 Enters

[sessions]
count = 16            # METHODOLOGY §15
user_base = 1         # usernames U00001..U00016
account = per-session

# Per account. These are the engine's kT20 values (src/engine/risk/profiles.h) except
# gross-exposure and kill-exposure. Gross exposure is open + executed notional over the
# whole run, and every IOC fill counts twice for the account (aggressor and resting order
# are both this session's). `loadgen run` predicts about $8.6B executed per account after
# 10 s at 4.2M msgs/s, so kT20's $5B gross and $100B kill limits would reject orders
# within seconds and latch the kill switch inside one T20 window. The values below cover
# 6M msgs/s for 100 s; the pilot fixes them together with the engine owner.
[risk]
permissions = 64      # kNoThroughBand
max-order-qty = 100000
max-order-notional = 100000000000        # $10M (PxE4 x shares)
fat-finger-bps = 1000
fat-finger-abs = 50000                   # $5.00
lop = 1
dup-window-sec = 1
port-rate = 1000000                      # messages / s / session
symbol-rate = 10000                      # orders / s / (session, symbol)
gross-exposure = 5000000000000000        # $500B (kT20: $5B)
symbol-notional = 10000000000000         # $1B
adv-pct = 50
kill-exposure = 5000000000000000         # $500B executed (kT20: $100B)
