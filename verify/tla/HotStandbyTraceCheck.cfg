\* Safety of TSpec (HotStandbyTrace.tla): HotStandby plus the generalizations trace
\* validation maps implementation steps onto. Reduced bounds, like HotStandbyCI.cfg.
SPECIFICATION TSpec
CONSTANTS
    Nodes = {a, b}
    Orders = {o1, o2}
    Nops = {p1, p2}
    TraceLog <- EmptyTrace
    MaxEpoch = 3
    MaxLog = 4
    MaxHostCrashes = 1
    MaxProcCrashes = 1
    MutNoOutputRule = FALSE
    MutNoMemberCheck = FALSE
    MutNoIncarnation = FALSE
    MutNoTruncate = FALSE
    MutNoDedupe = FALSE
    MutAckBeforeAppend = FALSE
    MutAckWhileCandidate = FALSE
    MutSoloReleaseFromL2 = FALSE
SYMMETRY NodeSymmetry
INVARIANTS
    TypeOK
    OnePrimaryPerEpoch
    WitnessAuthority
    LeaderCompleteness
    ReleasedConsistent
    ClientStreamPrefix
    NoDuplicateExecution
    ClientNoDuplicate
