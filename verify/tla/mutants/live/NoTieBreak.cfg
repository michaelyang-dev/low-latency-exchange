\* Liveness mutant: no witness tie-break (expect NoTakeoverOnCut violated).
SPECIFICATION LiveSpec
CONSTANTS
    Nodes = {a, b}
    Orders = {o1, o2}
    MaxEpoch = 4
    MaxLog = 6
    MaxHostCrashes = 0
    MaxProcCrashes = 0
    LMutLiteralTieBreak = FALSE
    LMutNoTieBreak = TRUE
    LinkCut = TRUE
    MutNoOutputRule = FALSE
    MutNoMemberCheck = FALSE
    MutNoIncarnation = FALSE
    MutNoTruncate = FALSE
    MutNoDedupe = FALSE
    MutAckBeforeAppend = FALSE
    MutAckWhileCandidate = FALSE
    MutSoloReleaseFromL2 = FALSE
INVARIANTS
    TypeOK
    Safety
    NoTakeoverOnCut
PROPERTIES
    EventuallyStablePrimary
    EventualDelivery
    CutLinkLeadsToSolo
