\* Reduced-bound safety model for push and pull-request CI. The full model
\* (HotStandby.cfg) runs nightly; see docs/verification/tla-results.md.
SPECIFICATION Spec
CONSTANTS
    Nodes = {a, b}
    Orders = {o1, o2}
    MaxEpoch = 3
    MaxLog = 4
    MaxHostCrashes = 1
    MaxProcCrashes = 1
    MutNoOutputRule = FALSE
    MutNoMemberCheck = FALSE
    MutNoIncarnation = FALSE
    MutNoTruncate = FALSE
    MutNoDedupe = FALSE
    MutAckBeforeAppend = FALSE
    MutAckWhileCandidate = FALSE
    MutSoloReleaseFromL2 = FALSE
SYMMETRY NodeSymmetry
INVARIANTS
    TypeOK
    OnePrimaryPerEpoch
    WitnessAuthority
    LeaderCompleteness
    ReleasedConsistent
    ClientStreamPrefix
    NoDuplicateExecution
    ClientNoDuplicate
